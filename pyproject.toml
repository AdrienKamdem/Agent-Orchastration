[project]
name = "markets-copilot"
version = "0.1.0"
description = "Personal markets research and portfolio copilot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0",
    "httpx>=0.27",
    "lxml>=5.2",
    "numpy>=1.26",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pymupdf>=1.24",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "tenacity>=8.2",
    "trafilatura>=1.12",
    "typer>=0.12",
]

[project.optional-dependencies]
# Real embedding model (pulls in PyTorch, ~1-2 GB). Install with: uv sync --extra embeddings
embeddings = ["sentence-transformers>=3.0"]

[project.scripts]
ingest = "copilot.ingestion.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.2",
    "respx>=0.21",
    "ruff>=0.5",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a Postgres+pgvector database (DATABASE_URL)",
    "live: hits real external sources; never run in CI",
]
addopts = "-m 'not live'"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
